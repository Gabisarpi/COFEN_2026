<title>Leituras Dirigidas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: mesma família visual do Treino de Discursivas. Lista de leituras por dia em cima; abaixo, os quatro passos (antes, ler, anotar, escrever) e a conferência recolhida. */
:root{
  --bg:#eef1f4;--sheet:#ffffff;--ink:#17212b;--mut:#566373;--line:#d3dae2;--rule:#e3e8ee;
  --acc:#14517a;--acc-soft:#dfeaf3;--ok:#1f6f4a;--ok-soft:#dff1e8;--warn:#94510a;--warn-soft:#fbeedb;--bad:#a32a2a;
  --f-display:"Archivo",system-ui,sans-serif;--f-body:"IBM Plex Sans",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d;--sheet:#1b222a;--ink:#e6ebf0;--mut:#9aa7b4;--line:#323c47;--rule:#2a333d;
  --acc:#7fb8e0;--acc-soft:#1f2f3c;--ok:#74cfa1;--ok-soft:#1b3027;--warn:#f0b868;--warn-soft:#332614;--bad:#f08f8f;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d;--sheet:#1b222a;--ink:#e6ebf0;--mut:#9aa7b4;--line:#323c47;--rule:#2a333d;
  --acc:#7fb8e0;--acc-soft:#1f2f3c;--ok:#74cfa1;--ok-soft:#1b3027;--warn:#f0b868;--warn-soft:#332614;--bad:#f08f8f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body)}
main{max-width:820px;margin:0 auto;padding-block:24px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
header p{margin:4px 0 0;color:var(--mut)}
.eyebrow{font:600 12px/1.4 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
h1{font:800 clamp(26px,5vw,34px)/1.15 var(--f-display);margin:6px 0 0;text-wrap:balance}
h2{font:700 21px/1.25 var(--f-display);margin:0;text-wrap:balance}
h3{font:700 16px/1.3 var(--f-display);margin:0}
#aviso{background:var(--warn-soft);color:var(--warn);padding:10px 14px;border-radius:6px}
#lista{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.item{all:unset;box-sizing:border-box;cursor:pointer;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:grid;gap:4px;min-width:0}
.item[aria-current="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.item:focus-visible,button:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.item b{font:700 15px/1.3 var(--f-display)}
.dia{font:600 13px/1.3 var(--f-mono);color:var(--acc);font-variant-numeric:tabular-nums}
.chip{justify-self:start;font:600 11px/1.5 var(--f-mono);padding:0 6px;border-radius:3px;background:var(--acc-soft);color:var(--acc)}
.chip.feito{background:var(--ok-soft);color:var(--ok)}
.chip.rascunho{background:var(--warn-soft);color:var(--warn)}
section{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:18px 20px;display:grid;gap:12px;min-width:0}
.passo{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.passo .t{font:600 12px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.meta{font:400 13px/1.5 var(--f-mono);color:var(--mut)}
section p{margin:0}
ol,ul.limpa{margin:0;padding-left:22px;display:grid;gap:6px}
.porque{border-left:3px solid var(--warn);padding:2px 0 2px 12px;color:var(--ink)}
.fonte{display:grid;gap:6px;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.fonte b{font:700 16px/1.35 var(--f-display)}
a.abrir{justify-self:start;font:600 15px/1.2 var(--f-body);padding:10px 14px;border-radius:6px;background:var(--acc);color:var(--sheet);text-decoration:none}
a{color:var(--acc)}
label.campo{display:grid;gap:6px;font:600 14px/1.4 var(--f-body)}
textarea.nota{width:100%;min-height:150px;resize:vertical;padding:10px 12px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:var(--sheet);font:400 15px/1.55 var(--f-body)}
.folha{display:grid;grid-template-columns:34px minmax(0,1fr);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.nums{margin:0;padding:8px 6px 8px 0;text-align:right;font:400 13px/28px var(--f-mono);color:var(--mut);background:var(--bg);white-space:pre}
textarea.linhas{display:block;width:100%;border:0;resize:vertical;padding:8px 10px;color:var(--ink);font:400 15px/28px var(--f-mono);background-color:var(--sheet);background-image:linear-gradient(to bottom,transparent 27px,var(--rule) 27px);background-size:100% 28px;background-position:0 8px;background-attachment:local}
textarea:focus{outline:none;border-color:var(--acc)}
.cmd{padding:12px 14px;border-radius:6px;background:var(--acc-soft)}
.barra{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.grupo{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#tl{font:600 14px/1.4 var(--f-mono);font-variant-numeric:tabular-nums}
#tl.alto{color:var(--bad)}
#salvo{font-size:13px;color:var(--mut)}
button{font:600 15px/1.2 var(--f-body);padding:10px 14px;border-radius:6px;border:1px solid var(--acc);background:var(--acc);color:var(--sheet);cursor:pointer}
button.sec{background:transparent;color:var(--acc)}
details{border-top:1px solid var(--line);padding-top:10px}
details:first-of-type{border-top:0;padding-top:0}
summary{cursor:pointer;font:700 16px/1.4 var(--f-display)}
details>div{padding-top:8px;display:grid;gap:8px}
dl{margin:0;display:grid;gap:8px}
dt{font:600 14px/1.4 var(--f-mono);color:var(--acc)}
dd{margin:0 0 0 14px}
.chk label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.chk input{margin-top:6px}
blockquote{margin:0;padding:8px 12px;border-left:3px solid var(--acc);background:var(--bg);font-style:italic}
blockquote cite{display:block;font:400 12px/1.4 var(--f-mono);font-style:normal;color:var(--mut);margin-top:4px}
#placar{font:600 14px/1.4 var(--f-mono);color:var(--ok)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
<main>
<header>
  <div class="eyebrow">COFEN 2026 · Cargo 407 · Gaby</div>
  <h1>Leituras Dirigidas</h1>
  <p>Um texto curto da fonte que a banca usa, lido com perguntas na mão: antes do treino de discursiva do dia ou como revisão de matéria já estudada. Cerca de 15 minutos. <span id="progresso"></span></p>
</header>
<div id="aviso" hidden></div>
<nav id="lista" aria-label="Leituras"><p class="meta">Carregando as leituras…</p></nav>
<div id="palco" style="display:grid;gap:18px"></div>
</main>
<script>
(function(){
  var LARG=60, KEY="cofen-gaby-leituras:";
  var db=null, canWrite=false, leituras=[], resp={}, atual=null, salvarT=null;
  var $=function(id){return document.getElementById(id)};
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function aviso(t){var a=$("aviso");a.textContent=t;a.hidden=false}
  function ler(k){try{return localStorage.getItem(KEY+k)}catch(e){return null}}
  function gravar(k,v){try{localStorage.setItem(KEY+k,v)}catch(e){}}
  function linhas(txt){
    var t=txt.replace(/\s+$/,""); if(!t) return 0;
    var n=0;
    t.split("\n").forEach(function(l){
      if(!l.trim()){n++;return}
      var cur=0,c=1;
      l.trim().split(/\s+/).forEach(function(w){
        var len=w.length;
        if(cur===0){cur=len} else if(cur+1+len<=LARG){cur+=1+len} else {c++;cur=len}
        while(cur>LARG){c++;cur-=LARG}
      });
      n+=c;
    });
    return n;
  }
  function estado(id){var r=resp[id];return r&&r.status?r.status:"novo"}
  function rotulo(s){return s==="feito"?"Feito":s==="rascunho"?"Em andamento":s==="sem_resposta"?"Só leitura":"A fazer"}
  function lista(){
    var el=$("lista");
    if(!leituras.length){el.innerHTML='<p class="meta">Nenhuma leitura por aqui ainda. Peça ao Claude as leituras dos próximos dias.</p>';return}
    el.innerHTML=leituras.map(function(t){
      var s=estado(t.id), k=s==="feito"||s==="sem_resposta"?"feito":s==="rascunho"?"rascunho":"";
      return '<button class="item" data-id="'+esc(t.id)+'" aria-current="'+(t.id===atual)+'"><span class="dia">'+esc(t.dia)+'</span><b>'+esc(t.tema)+'</b><span class="chip '+k+'">'+rotulo(s)+'</span></button>';
    }).join("");
    el.querySelectorAll(".item").forEach(function(b){b.onclick=function(){abrir(b.dataset.id)}});
    var f=leituras.filter(function(t){return estado(t.id)==="feito"}).length;
    $("progresso").textContent=f+" de "+leituras.length+" feitas.";
  }
  function conferencia(t,r){
    var marc=(r&&r.marcados)||[];
    var h='<section id="sol"><h2>Conferência</h2><p class="meta">Compare primeiro os seus termos, depois marque o que o seu parágrafo cobriu.</p>';
    h+='<details open><summary>Termos que a fonte usa</summary><div><dl>'+t.ancoras.map(function(a){return '<dt>'+esc(a.termo)+'</dt><dd>'+esc(a.sentido)+'</dd>'}).join("")+'</dl></div></details>';
    h+='<details class="chk" open><summary>Quais destes termos apareceram no seu texto? <span id="placar"></span></summary><div>'+t.ancoras.map(function(a,i){
      return '<label><input type="checkbox" id="ck-'+i+'"'+(marc[i]?" checked":"")+'> <span>'+esc(a.termo)+'</span></label>'}).join("")+'<p class="meta">Esta contagem é a medida do piloto. Marque só o que está escrito, com o sentido certo.</p></div></details>';
    h+='<details><summary>Frases da fonte para guardar</summary><div>'+t.frases.map(function(f){return '<blockquote>'+esc(f.texto)+'<cite>'+esc(f.onde)+'</cite></blockquote>'}).join("")+'</div></details>';
    h+='<details><summary>Como levar para a Q2</summary><div><p>'+esc(t.na_q2)+'</p></div></details>';
    return h+'</section>';
  }
  function placar(t){
    var b=[].slice.call(document.querySelectorAll('#sol input[type=checkbox]'));
    $("placar").textContent=b.filter(function(x){return x.checked}).length+"/"+t.ancoras.length;
    return b.map(function(x){return x.checked});
  }
  function abrir(id){
    atual=id; gravar("atual",id);
    var t=leituras.filter(function(x){return x.id===id})[0]; if(!t) return;
    var r=resp[id]||{}, s=estado(id), aberto=s==="feito"||s==="sem_resposta", tr=t.treino||{};
    var h='<section><div class="passo"><span class="t">1 · Antes de ler · 2 min</span></div><h2>'+esc(t.tema)+'</h2>'+
      '<p class="porque">'+esc(t.porque)+'</p><h3>Leia procurando a resposta destas perguntas</h3><ol>'+
      t.perguntas.map(function(q){return '<li>'+esc(q)+'</li>'}).join("")+'</ol></section>';
    h+='<section><div class="passo"><span class="t">2 · Ler · '+esc(t.minutos)+' min</span></div><div class="fonte"><span class="meta">'+esc(t.fonte)+'</span><b>'+esc(t.titulo)+'</b>'+
      '<p><b style="font:600 14px var(--f-body)">Onde ler:</b> '+esc(t.secao)+'</p><a class="abrir" href="'+esc(t.url)+'" target="_blank" rel="noopener">Abrir o texto</a></div>'+
      (t.extra?'<p class="meta">Se sobrar tempo: <a href="'+esc(t.extra.url)+'" target="_blank" rel="noopener">'+esc(t.extra.titulo)+'</a>. '+esc(t.extra.nota||"")+'</p>':'')+'</section>';
    h+='<section><div class="passo"><span class="t">3 · Anotar · durante a leitura</span></div>'+
      '<label class="campo" for="termos">Cinco termos exatos do texto, cada um com o sentido em poucas palavras<textarea class="nota" id="termos" placeholder="cofre de segredos: guarda o segredo fora do código, com acesso por papel"></textarea></label>'+
      '<label class="campo" for="mapa">Problema → causa → controle → justificativa (uma linha por problema)<textarea class="nota" id="mapa" placeholder="senha no YAML → qualquer leitor do repositório a vê → cofre + identidade gerenciada → o segredo deixa de existir no código"></textarea></label></section>';
    h+='<section><div class="passo"><span class="t">'+(tr.tipo==="revisao"?'4 · Fixar · revisão sem treino escrito':'4 · Escrever · no treino do dia')+'</span></div><div class="cmd"><p><b>'+esc(tr.nome)+'</b></p><p>'+esc(tr.nota)+'</p></div>'+
      (tr.url?'<a class="abrir" href="'+esc(tr.url)+'" target="_blank" rel="noopener">Abrir o treino</a>':'')+
      '<p class="meta">Julgue a situação antes de recomendar. Quando terminar o texto, volte aqui e abra a conferência.</p>'+
      '<div class="barra"><div class="grupo"><span id="salvo"></span></div><div class="grupo" id="acoes"></div></div></section>';
    if(aberto) h+=conferencia(t,r);
    $("palco").innerHTML=h;
    ["termos","mapa"].forEach(function(k){
      var el=$(k); el.value=r[k]||ler(k+":"+id)||"";
      el.oninput=function(){agendar(t.id,k)};
    });
    acoes(t,aberto); lista();
    if(aberto){placar(t);document.querySelectorAll('#sol input[type=checkbox]').forEach(function(c){c.onchange=function(){salvar(t.id,{marcados:placar(t)})}})}
  }
  function acoes(t,aberto){
    var a=$("acoes");
    if(aberto){a.innerHTML='<span class="meta">Conferência aberta abaixo.</span>';return}
    a.innerHTML='<button class="sec" id="pular">Só li, sem escrever</button><button id="fim">Escrevi: abrir a conferência</button>';
    $("fim").onclick=function(){
      if($("termos").value.trim().length<20){$("salvo").textContent="Anote os termos da leitura antes de abrir a conferência.";return}
      concluir(t,"feito");
    };
    $("pular").onclick=function(){concluir(t,"sem_resposta")};
  }
  function campos(){return {termos:$("termos").value,mapa:$("mapa").value}}
  function concluir(t,st){
    var c=Object.assign(campos(),{status:st,concluido:new Date().toISOString()});
    salvar(t.id,c).then(function(){abrir(t.id);var s=$("sol");if(s)s.scrollIntoView()});
  }
  function agendar(id,k){
    gravar(k+":"+id,$(k).value);
    clearTimeout(salvarT);
    salvarT=setTimeout(function(){
      if(!$("termos")) return;
      var s=estado(id);
      salvar(id,Object.assign(campos(),{status:s==="novo"?"rascunho":s}));
    },1500);
  }
  function salvar(id,c){
    resp[id]=Object.assign({},resp[id],c);
    if(!db||!canWrite){var e=$("salvo"); if(e) e.textContent="Salvo só neste navegador."; return Promise.resolve()}
    return db.doc("respostas/"+id).set(Object.assign({},resp[id],{atualizado:new Date().toISOString()})).then(function(){
      var el=$("salvo"); if(el) el.textContent="Salvo."; lista();
    }).catch(function(){var el=$("salvo"); if(el) el.textContent="Não consegui salvar. O texto segue neste navegador."});
  }
  (async function(){
    db=window.claude&&window.claude.use?await window.claude.use("db"):null;
    if(!db){aviso("Abra esta página pelo claude.ai, com a sua conta, para carregar as leituras.");$("lista").innerHTML="";return}
    var user=await window.claude.use("user");
    var pode=user?await user.can("data.write"):null;
    canWrite=pode!==false;
    if(!canWrite) aviso("Você só pode ver esta página; as respostas não serão salvas.");
    var pronto=false;
    db.collection("respostas").onSnapshot(function(snap){
      snap.docs.forEach(function(d){
        var v=d.data()||{}, ae=document.activeElement;
        if(d.id===atual&&ae&&["termos","mapa"].indexOf(ae.id)>=0){var o=resp[d.id]||{};v.termos=o.termos;v.mapa=o.mapa}
        resp[d.id]=v;
      });
      if(pronto) lista();
    },function(){aviso("A conexão com o salvamento caiu. Recarregue a página.")});
    db.collection("leituras").onSnapshot(function(snap){
      leituras=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())}).sort(function(a,b){return (a.ordem||0)-(b.ordem||0)});
      var primeiro=!pronto; pronto=true; lista();
      if(primeiro&&leituras.length){
        var salvo=ler("atual"), id=leituras.some(function(t){return t.id===salvo})?salvo:(leituras.filter(function(t){return estado(t.id)==="novo"})[0]||leituras[0]).id;
        abrir(id);
      }
    },function(){aviso("Não consegui carregar as leituras. Recarregue a página.")});
  })();
})();
</script>
